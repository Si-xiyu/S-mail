server:
  port: 8080

spring:
  profiles:
    default: dev
  application:
    name: smartmail-backend
  datasource:
    url: ${SMARTMAIL_DB_URL:jdbc:mysql://localhost:3306/smartmail?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SMARTMAIL_DB_USERNAME:root}
    password: ${SMARTMAIL_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

smartmail:
  auth:
    token-secret: ${SMARTMAIL_TOKEN_SECRET:smartmail-dev-secret-change-me}
    token-ttl-seconds: 86400
  internal-token: ${SMARTMAIL_INTERNAL_TOKEN:smartmail-internal-dev-token}
  ai:
    enabled: ${SMARTMAIL_AI_ENABLED:true}
    agent-base-url: ${SMARTMAIL_AGENT_BASE_URL:http://localhost:8000}
    plugin-token: ${SMARTMAIL_AGENT_PLUGIN_TOKEN:smartmail-agent-plugin-dev-token}
    timeout-seconds: 5
  storage:
    attachment-path: ${SMARTMAIL_STORAGE_PATH:./storage/attachments}
  trash:
    retention-days: ${SMARTMAIL_TRASH_RETENTION_DAYS:30}
    cleanup-cron: "${SMARTMAIL_TRASH_CLEANUP_CRON:0 0 3 * * *}"
